AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Learning URL shortener with public redirects, atomic visit counts, and same-origin frontend.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref: docs/LEARNING.md

Parameters:
  AllowedHosts:
    Type: String
    Default: ''
    Description: Optional comma-separated exact destination hostnames for a controlled demo.

Rules:
  SelectedRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-2]
        AssertDescription: This project must remain in the selected Region us-east-2.

Resources:
  LinksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  AppLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
        DetailedMetricsEnabled: false
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogs.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","responseLength":"$context.responseLength"}'

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApplicationDataAndLogsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt LinksTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AppLogs.Arn

  AppFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: More CPU for SDK startup after measured 128 MB startup timeouts; bounded request duration.
        must:
          - Keep Python 3.12 and deploy in us-east-2.
          - Reuse the scoped table and log permissions; do not broaden IAM for performance tuning.
    Properties:
      CodeUri: backend/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 15
      Role: !GetAtt AppRole.Arn
      LoggingConfig:
        LogGroup: !Ref AppLogs
        LogFormat: Text
      Environment:
        Variables:
          TABLE_NAME: !Ref LinksTable
          ALLOWED_HOSTS: !Ref AllowedHosts
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: GET
            PayloadFormatVersion: '2.0'
        AssetsAndLinks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'

Outputs:
  ApplicationUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  TableName:
    Value: !Ref LinksTable
  FunctionName:
    Value: !Ref AppFunction
  FunctionLogGroup:
    Value: !Ref AppLogs
  ApiLogGroup:
    Value: !Ref ApiLogs
